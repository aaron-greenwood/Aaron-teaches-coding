<html>

<head>
    <title>Exercise 2.2</title>
    <style>
        table, td {
            border: 10px solid rgb(162, 0, 255); 
            border-collapse: collapse;
            background-color: rgb(0, 17, 255);
        }
        table {min-height: 700px; min-width: 700px; }
    </style>
</head>

<body>
    <h1>Exercise 2.2</h1>
    <table>
        <tr id="row1">
            <td id="r1col1" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
            <td id="r1col2" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
            <td id="r1col3" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
        </tr>
        <tr id="row2">
            <td id="r2col1" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
            <td id="r2col2" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
            <td id="r2col3" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
        </tr>
                <tr id="row3">
            <td id="r3col1" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
            <td id="r3col2" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
            <td id="r3col3" onmouseenter="MakeCurrentCell(event)"  onmouseleave="MakeNonCurrentCell(event)"></td>
        </tr>
    </table>
    <p id="output"></p>

    <script>
        function MakeCurrentCell(event) {
            event.target.style.backgroundColor = "red";
        }
        function MakeNonCurrentCell(event) {
            event.target.style.backgroundColor = "blue";
        }

    </script>
</body>

</html>
