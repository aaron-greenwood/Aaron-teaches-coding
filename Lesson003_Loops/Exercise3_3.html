<html>

<head>
    <title>Exercise 3.1</title>
    <style>
        table, td {
            border: 1px solid black; 
            border-collapse: collapse;
            background-color: white;
        }
        table {overflow: hidden;table-layout: fixed; width:400px; height:400px;}
        tr {overflow: hidden;table-layout: fixed; }
        td {overflow: hidden; height: 100px; width: 100px; text-align: center; font-size:10px;padding-top: 0px;  
            padding-bottom: 0px;}
    </style>
</head>

<body>
    <h1>Exercise 3.1</h1>
    <button type="button" onclick="CreateTable(3,3)">Create Table</button>
    <table id="myTable">

    </table>

    <!--Add your headings and paragraphs for multiplication and division below-->

    <script>
        function CreateTable(x,y)
        {
           var table = document.getElementById("myTable");
              for(var i = 0; i < x; i++)
              {
                 var row = table.insertRow(i);
                 for(var j = 0; j < y; j++)
                 {
                      var cell = row.insertCell(j);
                      cell.innerText = "Row " + (i+1) + " Column " + (j+1);
                 }
              }
        }

        //Add your scripts for mulitiplication and division below

    </script>
</body>

</html>
